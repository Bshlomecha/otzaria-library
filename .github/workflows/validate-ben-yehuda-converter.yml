name: Validate Ben-Yehuda converter

on:
  pull_request:
    paths:
      - "Ben-YehudaToOtzaria/סקריפטים/**"
      - ".github/workflows/validate-ben-yehuda-converter.yml"
  push:
    branches:
      - main
    paths:
      - "Ben-YehudaToOtzaria/סקריפטים/**"
      - ".github/workflows/validate-ben-yehuda-converter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout converter tests
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /Ben-YehudaToOtzaria/סקריפטים/otzaria_markup.py
            /Ben-YehudaToOtzaria/סקריפטים/split_footnotes.py
            /Ben-YehudaToOtzaria/סקריפטים/test_otzaria_markup.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run converter tests
        working-directory: Ben-YehudaToOtzaria/סקריפטים
        run: python3 test_otzaria_markup.py
